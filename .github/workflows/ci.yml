name: CI

# 质量门禁：任何分支提交（main 除外）、PR、手动触发都会跑 lint → typecheck → test → build → smoke。
# main 不在这里跑，是因为 production.yml 的 build job 已包含同一套门禁，避免重复消耗。
# CI 不碰任何环境、不部署；部署只由 staging.yml / production.yml 负责。
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR 的多次提交只保留最新一次，省机器
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / 类型检查 / 单元测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Lint（零外链 / 安全 / 结构 / 移动端规范）
        run: npm run lint

      - name: 类型检查（引用完整性 + 契约 + 调用图无环）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

  build:
    name: 构建 + 冒烟
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 计算版本号
        id: meta
        run: echo "version=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: 构建
        run: npm run build
        env:
          DEPLOY_TARGET: pages
          BUILD_VERSION: ${{ steps.meta.outputs.version }}

      - name: 冒烟测试（起本地静态服务真实取页）
        run: npm run smoke

      - name: 产物摘要
        if: always()
        run: |
          {
            echo "### 构建产物"
            echo '```json'
            cat dist/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: workbench-dist
          path: dist
          retention-days: 7
